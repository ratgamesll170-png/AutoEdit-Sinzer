
name: Build AutoEdit Sinzer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -o AutoEdit.Sinzer.zip -d extracted
          find extracted -type f -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f -name settings.gradle.kts -o -name settings.gradle | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ไม่พบไฟล์ settings.gradle ใน ZIP"
            exit 1
          fi
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            cd "$PROJECT_DIR"
            ./gradlew assembleDebug
          else
            echo "ไม่พบ Gradle Wrapper ต้องตรวจสอบโปรเจกต์ก่อน"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoEdit-Sinzer-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
