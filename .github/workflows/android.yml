
name: Build AutoEdit Sinzer APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          unzip -o AutoEdit.Sinzer.zip -d extracted
          find extracted -type f -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          WRAPPER="$(find extracted -type f -name gradlew | head -n 1)"
          if [ -z "$WRAPPER" ]; then
            echo "ไม่พบ Gradle Wrapper ใน ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoEdit-Sinzer-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
